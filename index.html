<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea Station</title>
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <!---------------- CSS ---------------------->
    <link href="./dist/output.css" rel="stylesheet" />
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lobster&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />

    <!---------------- Scripts ---------------------->
    <!-- defer: giúp load tệp scripts khi load xong html -->
    <script defer type="module" src="./js/main.js"></script>
  </head>
  <body>
    <section
      id="hero"
      class="h-screen max-h-[1100px] bg-linear-to-t from-p-100 to-white overflow-y-clip"
    >
    <div
        class="container relative flex items-center justify-center w-full h-full"
      >
      <!-- hình -->
      <div class="absolute bottom-0 right-0 overflow-hidden z-0">
        <img src="./assets/hero_img.png" alt="hero-img" class="h-full" />
      </div>
      <!-- Nội dung chính -->
        <div class="flex flex-col items-center justify-center gap-4 z-10">
          <div>
            <h2
            class="mb-2 text-xs font-semibold leading-none tracking-wider text-center uppercase font-inter"
          >
            hơn một trăm hương vị trà
          </h2>
          <h1
            class="text-5xl leading-none tracking-wide text-center capitalize font-lobster text-p-900"
          >
            Trà Đặc Biệt Chế Tác
          </h1>
          </div>
              <p>
          Sứ mệnh của chúng tôi là mang đến cho bạn sự yên bình và kết nối thông
          qua các hương vị trà được chọn lọc cẩn thận và được tạo ra để nâng cao
          trải nghiệm hàng ngày và sức khoẻ toàn diện cho bạn.
        </p>
        <button>
          <a href=""
            >Tìm Hiểu Sản Phẩm
            <img src="/assets/right-arrow.svg" alt="right-arrow"
          /></a>
        </button>
        </div>
    </div>
    </section>
  </body>
</html>
